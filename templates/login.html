<!DOCTYPE html>
<html lang="bg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container mt-5"><h2>Вход</h2><form method="post">
<div class="mb-3"><label>Имейл</label><input type="text" name="email" class="form-control" required></div>
<div class="mb-3"><label>Парола</label><input type="password" name="password" class="form-control" required></div>
<button type="submit" class="btn btn-primary">Вход</button></form>
{% with messages = get_flashed_messages() %}{% if messages %}<div class="alert alert-danger mt-3">{{ messages[0] }}</div>{% endif %}{% endwith %}
</div></body></html>
